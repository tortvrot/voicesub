name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements-mac.txt

      - name: Build VoiceSub.app
        run: pyinstaller --noconfirm --onefile --windowed --name VoiceSub main.py

      - name: Build SetupLanguages
        run: pyinstaller --noconfirm --onefile --console --name SetupLanguages setup_languages.py

      - name: Упаковать в zip (сохраняет права доступа .app)
        run: |
          cd dist
          zip -r VoiceSub_mac.zip VoiceSub.app SetupLanguages

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceSub-macOS
          path: dist/VoiceSub_mac.zip

